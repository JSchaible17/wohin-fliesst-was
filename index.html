<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112e37"><title>Wohin fließt was?</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17333d;background:#f5f3ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #b05e00;outline-offset:4px}header{background:#112e37;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.03em}header small{font-weight:400;color:#c8dddf}main{max-width:780px;margin:auto;padding:32px 22px 48px}h1{font-size:clamp(38px,8vw,64px);letter-spacing:-.06em;line-height:1.04;margin:20px 0}h2{font-size:clamp(24px,5vw,32px);line-height:1.2;margin:12px 0 20px;letter-spacing:-.03em}p{line-height:1.6}.eyebrow{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.14em;color:#536b70}.lead{font-size:19px;max-width:580px;color:#52676c}.primary{border:0;background:#12685e;color:white;border-radius:14px;padding:16px 24px;font-weight:700;min-height:52px}.primary:hover{background:#0c5048}.secondary{background:transparent;border:1px solid #a6b7b4;border-radius:12px;padding:12px 18px;color:#17333d}.intro-diagram{margin:32px 0;padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-block:1px solid #d4ded8}.entity{font-weight:750;text-align:center}.icon{font-size:38px;display:block;margin-bottom:8px}.streams{flex:1;max-width:280px;text-align:center;color:#12685e;font-size:34px;line-height:1.1}.intro-meta{font-size:14px;color:#5c7175;margin-top:16px}.topline{display:flex;justify-content:space-between;font-size:14px;color:#536b70;margin-bottom:10px}.progress{height:6px;background:#dce5df;border-radius:10px;margin-bottom:30px;overflow:hidden}.progress span{display:block;background:#198477;height:100%;transition:width .3s}.scene{background:white;border:1px solid #dce3dd;border-radius:20px;padding:24px;margin-bottom:24px;box-shadow:0 6px 20px #17333d06}.scene p{margin:0;font-size:19px}.steps{margin:20px 0}.label{display:block;font-size:15px;font-weight:750;margin-bottom:10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:white;border:2px solid #d6ded8;border-radius:13px;padding:16px 12px;color:#17333d;min-height:64px;text-align:center;font-weight:650}.choice[aria-pressed=true]{border-color:#12685e;background:#e1f0e9;box-shadow:inset 0 0 0 1px #12685e}.choice:disabled{cursor:default}.direction span{display:block;font-size:23px;margin:3px}.feedback{padding:16px 18px;border-radius:12px;background:#fbe9ce;color:#754208;margin:18px 0;line-height:1.5}.feedback.good{background:#def1e5;color:#174c37}.feedback:empty{display:none}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hint{font-size:14px;color:#536b70;margin-top:16px;line-height:1.5}.score{font-size:64px;font-weight:800;letter-spacing:-.06em;color:#12685e;margin:16px 0 0}.map{margin:24px 0;border:1px solid #d4ded8;background:white;border-radius:18px;padding:20px}.map-head{display:flex;justify-content:space-between;font-weight:750;font-size:16px;margin-bottom:16px}.flow{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid #e3e7e3;padding:14px 0;font-size:15px}.flow b{color:#12685e}.flow.money b{color:#315cb3}.legend{font-size:13px;color:#52676c}.review{padding:12px 0;border-top:1px solid #d4ded8}.review summary{cursor:pointer;font-weight:650;padding:8px 0}.footer{font-size:12px;color:#607376;margin-top:36px}.repair .choices{grid-template-columns:1fr}.repair .choice{text-align:left}.hidden{display:none!important}@media(max-width:450px){main{padding:22px 16px}header{padding:16px}.scene{padding:20px}.choice{padding:14px 8px;font-size:14px}.entity{font-size:14px}.icon{font-size:32px}.streams{font-size:28px}.flow{font-size:13px}.map{padding:15px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><header><span>Wohin fließt was?</span><small>WR · Klasse 8</small></header><main id="app"></main><script>
const tasks=[
{title:'Feierabend in der Firma',text:'Leons Vater montiert Golfschläger und prüft ihre Qualität. Betrachte seine Arbeitsleistung.',dir:'HU',kind:'G',hint:'Wer stellt seine Arbeitskraft zur Verfügung? Wer nutzt sie?',explain:'Die Arbeitsleistung fließt vom privaten Haushalt zum Unternehmen. Sie zählt hier zum Güterstrom.'},
{title:'Der Lohn ist da',text:'Die Firma bezahlt Leons Vater seinen monatlichen Lohn. Betrachte die Lohnzahlung.',dir:'UH',kind:'M',hint:'Wer zahlt den Lohn und wer bekommt ihn?',explain:'Das Unternehmen zahlt Einkommen an den privaten Haushalt. Das ist ein Geldstrom.'},
{title:'Die neue Spielekonsole',text:'Leon und sein Vater kaufen eine Konsole im Elektromarkt. Sie nehmen die Konsole mit nach Hause. Betrachte nur die Konsole.',dir:'UH',kind:'G',hint:'Woher kommt die Ware, und wer erhält sie?',explain:'Die Konsole ist eine Ware. Sie fließt vom Unternehmen zum Haushalt und gehört zum Güterstrom.'},
{title:'600 Euro an der Kasse',text:'Leons Vater bezahlt die Konsole. Der Elektromarkt erhält 600,00 €. Betrachte die Bezahlung.',dir:'HU',kind:'M',hint:'Wer gibt bei diesem Einkauf Geld aus?',explain:'Der Haushalt bezahlt das Unternehmen. Seine Konsumausgaben gehören zum Geldstrom.'},
{title:'Ein neuer Haarschnitt',text:'Eine Friseurin schneidet Leon die Haare. Betrachte die Dienstleistung, nicht die Bezahlung.',dir:'UH',kind:'G',hint:'Güter sind nicht nur Gegenstände. Wer erbringt hier die Dienstleistung?',explain:'Der Haarschnitt ist eine Dienstleistung des Unternehmens für den Haushalt. Er gehört zum Güterstrom.'},
{title:'Bezahlen beim Friseur',text:'Leon bezahlt den Haarschnitt aus seinem Taschengeld. Betrachte nur die Zahlung an den Friseursalon.',dir:'HU',kind:'M',hint:'Leon gehört zu einem privaten Haushalt. Der Friseursalon ist ein Unternehmen.',explain:'Die Zahlung fließt vom Haushalt zum Unternehmen. Das ist ein Geldstrom.'}
];
let index=0,selectedDir=null,selectedKind=null,tries=0,firstCorrect=0,done=false,results=[],repairChoice=null;const app=document.getElementById('app');
const dirLabel={HU:'Haushalte → Unternehmen',UH:'Unternehmen → Haushalte'},kindLabel={G:'Güterstrom',M:'Geldstrom'};
function goTop(){window.scrollTo({top:0,behavior:'instant'});const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function start(){index=0;firstCorrect=0;results=[];renderQuestion();goTop()}
function intro(){app.innerHTML=`<div class="eyebrow">Das Kreislauf-Spiel</div><h1>Wohin<br>fließt was?</h1><p class="lead">Arbeit, Lohn, Konsole, Geld: Finde heraus, was Haushalte und Unternehmen miteinander austauschen.</p><div class="intro-diagram" aria-hidden="true"><div class="entity"><span class="icon">⌂</span>Haushalte</div><div class="streams">⟶<br>⟵</div><div class="entity"><span class="icon">▥</span>Unternehmen</div></div><p>Wähle bei jeder Aufgabe die <strong>Richtung</strong> und die <strong>Art des Stroms</strong>. Zum Schluss reparierst du einen Fehler im Kreislauf.</p><button class="primary" id="start">Los geht’s</button><p class="intro-meta">7 Aufgaben · etwa 5 Minuten · allein oder zu zweit</p><p class="footer">Kein Name nötig. Deine Antworten bleiben nur für diese Spielrunde im Browser.</p>`;document.getElementById('start').onclick=start}
function frame(title,text){return `<div class="topline"><span>Aufgabe ${index+1} von 7</span><span>${firstCorrect} direkt richtig</span></div><div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${index}"><span style="width:${index/7*100}%"></span></div><h2>${title}</h2><div class="scene"><p>${text}</p></div>`}
function renderQuestion(){selectedDir=null;selectedKind=null;tries=0;done=false;if(index===6){renderRepair();return}const t=tasks[index];app.innerHTML=frame(t.title,t.text)+`<section class="steps"><span class="label">1. In welche Richtung?</span><div class="choices"><button class="choice direction" data-dir="HU" aria-pressed="false">Haushalte<span>↓</span>Unternehmen</button><button class="choice direction" data-dir="UH" aria-pressed="false">Unternehmen<span>↓</span>Haushalte</button></div></section><section class="steps"><span class="label">2. Welche Art von Strom?</span><div class="choices"><button class="choice" data-kind="M" aria-pressed="false">Geldstrom</button><button class="choice" data-kind="G" aria-pressed="false">Güterstrom</button></div></section><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="primary" id="check">Antwort prüfen</button><button class="secondary" id="hint">Tipp</button></div><div id="hinttext" class="hint" role="status"></div>`;
app.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{selectedDir=b.dataset.dir;app.querySelectorAll('[data-dir]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});app.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{selectedKind=b.dataset.kind;app.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.getElementById('hint').onclick=()=>document.getElementById('hinttext').textContent=t.hint;document.getElementById('check').onclick=check}
function check(){if(done){index++;renderQuestion();goTop();return}const f=document.getElementById('feedback'),t=tasks[index];if(!selectedDir||!selectedKind){f.textContent='Wähle zuerst eine Richtung und eine Stromart.';return}tries++;if(selectedDir===t.dir&&selectedKind===t.kind){if(tries===1)firstCorrect++;results.push({title:t.title,answer:dirLabel[t.dir]+' · '+kindLabel[t.kind],first:tries===1});success(t.explain)}else{f.className='feedback';f.textContent=(selectedDir!==t.dir?'Prüfe die Richtung: '+t.hint:'Die Richtung stimmt. Überlege noch einmal: Wird Geld oder eine Ware bzw. Leistung ausgetauscht?')+' Versuche es noch einmal.'}}
function success(explain){done=true;const f=document.getElementById('feedback');f.className='feedback good';f.textContent='Richtig! '+explain;app.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('check').textContent=index===6?'Mein Ergebnis':'Weiter';document.getElementById('hint')?.classList.add('hidden')}
function renderRepair(){repairChoice=null;app.innerHTML=frame('Repariere den Kreislauf','Leon behauptet: „Wenn Papa seinen Lohn bekommt, fließt Geld vom Haushalt zum Unternehmen.“')+`<section class="repair"><span class="label">Welche Verbesserung stimmt?</span><div class="choices"><button class="choice" data-repair="0" aria-pressed="false">Der Lohn ist ein Güterstrom vom Haushalt zum Unternehmen.</button><button class="choice" data-repair="1" aria-pressed="false">Der Lohn ist ein Geldstrom vom Unternehmen zum Haushalt.</button><button class="choice" data-repair="2" aria-pressed="false">Der Lohn ist ein Güterstrom vom Unternehmen zum Haushalt.</button></div></section><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="check" class="primary">Antwort prüfen</button></div>`;app.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>{repairChoice=Number(b.dataset.repair);app.querySelectorAll('[data-repair]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.getElementById('check').onclick=()=>{if(done){finish();goTop();return}const f=document.getElementById('feedback');if(repairChoice===null){f.textContent='Wähle eine Verbesserung aus.';return}tries++;if(repairChoice===1){if(tries===1)firstCorrect++;results.push({title:'Kreislauf-Reparatur',answer:'Lohn: Geldstrom vom Unternehmen zum Haushalt.',first:tries===1});success('Das Unternehmen bezahlt den Lohn. Der Haushalt erhält ihn.')}else{f.textContent='Lohn ist Geld. Wer zahlt es, und wer erhält es? Versuche es erneut.'}}}
function finish(){app.innerHTML=`<div class="eyebrow">Runde abgeschlossen</div><h1>Der Kreislauf<br>steht!</h1><div class="score">${firstCorrect}<span style="font-size:28px"> / 7</span></div><p>Aufgaben beim ersten Versuch richtig. Du hast jetzt alle sieben Aufgaben gelöst.</p><div class="map"><div class="map-head"><span>Haushalte</span><span>Unternehmen</span></div><div class="flow"><b>Arbeitsleistung</b><span>→</span></div><div class="flow money"><b>Einkommen (Lohn / Gehalt)</b><span>←</span></div><div class="flow"><b>Güter (Waren / Dienstleistungen)</b><span>←</span></div><div class="flow money"><b>Konsumausgaben</b><span>→</span></div><div class="legend">Grün: Güterstrom · Blau: Geldstrom</div></div><p><strong>Zu jedem Austausch gehört eine Gegenleistung.</strong> Geld- und Güterstrom fließen dabei jeweils in entgegengesetzte Richtungen.</p><details class="review"><summary>Meine Antworten ansehen</summary>${results.map(r=>`<p><strong>${r.title}</strong><br>${r.answer}<br><small>${r.first?'Direkt richtig':'Mit einem weiteren Versuch gelöst'}</small></p>`).join('')}</details><p>Zum Besprechen: Wie hängen Papas Arbeit und der Kauf der Konsole zusammen?</p><button id="again" class="primary">Noch einmal spielen</button><p class="footer">Vereinfachtes Modell: nur Haushalte und Unternehmen, ohne Sparen, Staat und Ausland. Arbeitsleistung dient hier als Beispiel für die Leistungen der Haushalte.</p>`;document.getElementById('again').onclick=start}
intro();
</script></html>
